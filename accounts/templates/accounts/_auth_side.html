<style>
  .auth{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;max-width:1040px;margin:34px auto 20px}

  .auth .side li{display:flex;align-items:center;gap:12px;margin:14px 0}

  <ul>
    <li>Luyện tập IELTS theo từng kỹ năng</li>
    <li>Theo dõi kết quả học tập</li>
    <li>Quản lý hồ sơ cá nhân</li>
  </ul>
  <div class="bar"></div>

</div>
